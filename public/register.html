<!DOCTYPE html>
<html lang="uk">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindFlow - Реєстрація</title>
        
        <link rel="stylesheet" href="css/utilities.css">
        <link rel="stylesheet" href="css/mainStyles.css">

        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        
    </head>
    <body class="bgc-0">

        <div id="react-register-root"></div>

        <script type="text/babel" src="components/Header.jsx"></script>
        <script type="text/babel" src="components/RegisterView.jsx"></script>
        <script type="text/babel" src="components/Footer.jsx"></script>

        <script type="text/babel">
            const RegisterApp = () => {
                
                // Навігація при кліку на логотип або "Головна"
                const navigateTo = (view) => {
                    window.location.href = 'index.html';
                };

                // Заглушка (гість і так не авторизований)
                const handleLogout = (e) => {
                    e.preventDefault();
                };

                return (
                    <div>
                        {/* Використовуємо наш єдиний компонент хедера */}
                        <Header 
                            currentView="register"
                            navigateTo={navigateTo}
                            username="Гість"
                            handleLogout={handleLogout}
                            isLoggedIn={false} 
                        />
                        
                        <main className="flex-container-column x-center y-center mg-2">
                            <RegisterView />
                        </main>
                        <Footer />
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('react-register-root'));
            root.render(<RegisterApp />);
        </script> 
        
    </body>
</html>
