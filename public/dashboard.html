<!DOCTYPE html>
<html lang="uk">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindFlow - Особистий кабінет</title>
        
        <link rel="stylesheet" href="css/utilities.css">
        <link rel="stylesheet" href="css/mainStyles.css">

        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    </head>
    <body class="bgc-0">

        <div id="react-dashboard-root"></div>

        <script type="text/babel">
            const { useState, useEffect } = React;

            // === ГОЛОВНИЙ КОМПОНЕНТ ДОДАТКУ (SPA З РОУТИНГОМ) ===
            const DashboardApp = () => {
                // Власний роутинг: 'feed' (записи), 'new' (форма), 'analytics' (таблиця)
                const [currentView, setCurrentView] = useState('feed'); 
                const [entries, setEntries] = useState([]);
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState('');
                const [username, setUsername] = useState('Користувач');

                // Функція завантаження записів з сервера (GET)
                const loadEntries = async () => {
                    setLoading(true);
                    setError('');
                    try {
                        const response = await fetch('/api/entries');
                        if (!response.ok) {
                            if (response.status === 401) {
                                window.location.href = 'login.html'; // якщо куки застаріли
                                return;
                            }
                            throw new Error('Не вдалося завантажити дані');
                        }
                        const data = await response.json();
                        setEntries(data);
                        
                        // Демонстрація читання імені з кукі через заголовок відповіді або логіку профілю
                        // (Для простоти беремо ім'я користувача, якщо записи існують)
                        if (data.length > 0) setUsername(data[0].user);
                    } catch (err) {
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                };

                // Завантажуємо записи при першому відкритті сторінки
                useEffect(() => {
                    loadEntries();
                }, []);

                // Функція додавання нового запису (POST)
                const handleAddEntry = async (newEntryData) => {
                    setLoading(true);
                    try {
                        const response = await fetch('/api/entries', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newEntryData)
                        });
                        if (!response.ok) throw new Error('Помилка збереження запису');
                        
                        await loadEntries(); // Перезавантажуємо масив з сервера
                        setCurrentView('feed'); // Повертаємо роутер на стрічку записів
                    } catch (err) {
                        alert(err.message);
                    } finally {
                        setLoading(false);
                    }
                };

                return (
                    <div>
                        {/* Хедер із поєднанням статичних посилань та React-роутингу */}
                        <header className="container-fluid bbr-1 brc-0 bgc-white inline-block white-space-nowrap overflow-hidden" style={{height: '70px'}}>
                            <div className="clmp-xmg-5 inline-block al-items-stretch text-al-left text-al-justify" id="header-container" style={{width: '90%', height: '100%'}}>
                                <div className="inline-block vertical-al-middle lh70px">
                                    <h2 className="inline-block vertical-al-middle mg-0 cl-prpl" style={{cursor: 'pointer'}} onClick={() => setCurrentView('feed')}>MindFlow</h2>
                                    <span className="lmg-24px" style={{color: 'gray'}}>Вітаємо, <b>{username}</b>!</span>
                                </div>
                                <div className="navbar inline-block w100" id="desktop-menu" style={{width: '60%', textAlign: 'right'}}>
                                    <nav className="navbar inline-block vertical-al-middle clmp-xmg-1">
                                        <ul className="inline-block mg-0 h100 y-center pg-0" style={{listStyle: 'none'}}>
                                            {/* Статичне посилання на головну сторінку, яке працює завжди */}
                                            <li className="inline-block">
                                                <a className="xpg-8px xmg-8px inline-block" href="index.html">
                                                    <h4>Головна</h4>
                                                </a>
                                            </li>
                                            
                                            {/* Внутрішній React-роутинг для особистого кабінету */}
                                            <li className="inline-block"><a className={`xpg-8px xmg-8px inline-block ${currentView === 'feed' ? 'cl-prpl' : ''}`} href="#" onClick={(e) => {e.preventDefault(); setCurrentView('feed');}}><h4>Дашборд</h4></a></li>
                                            <li className="inline-block"><a className={`xpg-8px xmg-8px inline-block ${currentView === 'new' ? 'cl-prpl' : ''}`} href="#" onClick={(e) => {e.preventDefault(); setCurrentView('new');}}><h4>Новий запис</h4></a></li>
                                            <li className="inline-block"><a className={`xpg-8px xmg-8px inline-block ${currentView === 'analytics' ? 'cl-prpl' : ''}`} href="#" onClick={(e) => {e.preventDefault(); setCurrentView('analytics');}}><h4>Аналітика</h4></a></li>
                                            
                                            {/* Посилання для виходу з акаунту з викликом API */}
                                            <li className="inline-block">
                                                <a className="xpg-8px xmg-8px inline-block" href="#" 
                                                onClick={async (e) => {
                                                    e.preventDefault(); 
                                                    await fetch('/api/logout', { method: 'POST' }); // Видаляємо кукі
                                                    window.location.href = 'index.html'; // Повертаємось на головну
                                                }} 
                                                style={{color: '#c62828'}}>
                                                    <h4>Вихід</h4>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </header>

                        {/* Контентна зона, яка змінюється залежно від поточного "роуту" */}
                        <main className="flex-container-column mg-2 clmp-xmg-2">
                            {error && <div style={{color: 'red', padding: '10px', backgroundColor: '#fff'}}>{error}</div>}
                            
                            {loading && <div className="text-al-center pg-2">Обробка запиту сервером...</div>}

                            {!loading && currentView === 'feed' && (
                                <FeedView entries={entries} onNavigateToNew={() => setCurrentView('new')} />
                            )}

                            {currentView === 'new' && (
                                <NewEntryView onSave={handleAddEntry} disabled={loading} />
                            )}

                            {currentView === 'analytics' && (
                                <AnalyticsView entries={entries} />
                            )}
                        </main>
                    </div>
                );
            };

            // === СУБ-КОМПОНЕНТ 1: СТРІЧКА ЗАПИСІВ ===
            const FeedView = ({ entries, onNavigateToNew }) => (
                <div class="flex-container-column w100">
                    <div className="flex-container-row flex-space-between y-center w100 ymg-16px">
                        <h2>Ваші особисті записи</h2>
                        <button className="prpl-btn pg-8px xpg-16px br-radius-16px" onClick={onNavigateToNew}>+ Додати думку</button>
                    </div>

                    {entries.length === 0 ? (
                        <div className="bgc-white pg-2 br-radius-24px text-al-center br-1 brc-0">
                            <p>У вас ще немає жодного запису. Створіть свій перший запис прямо зараз!</p>
                        </div>
                    ) : (
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '20px', width: '100%'}}>
                            {entries.map(item => (
                                <div key={item.id} className="bgc-white br-radius-24px pg-2 br-1 brc-0 flex-container-column">
                                    <div style={{display: 'flex', justifyContent: 'between', alignItems: 'center', borderBottom: '1px solid #eee', paddingBottom: '8px'}}>
                                        <span style={{fontSize: '0.85rem', color: '#666'}}>{item.date}</span>
                                        <span style={{marginLeft: 'auto', backgroundColor: 'rgb(246, 246, 255)', color: 'rgb(92, 43, 226)', padding: '4px 8px', borderRadius: '8px', fontWeight: 'bold'}}>
                                            Настрій: {item.mood}/5
                                        </span>
                                    </div>
                                    <p style={{flexGrow: 1, padding: '12px 0', margin: 0, lineHeight: '1.5'}}>{item.content}</p>
                                    <div style={{color: 'gray', fontSize: '0.9rem', fontStyle: 'italic'}}>{item.tags}</div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            // === СУБ-КОМПОНЕНТ 2: ФОРМА ДЛЯ НОВОГО ЗАПИСУ ===
            const NewEntryView = ({ onSave, disabled }) => {
                const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
                const [mood, setMood] = useState('3');
                const [tags, setTags] = useState('');
                const [content, setContent] = useState('');

                const handleSubmit = (e) => {
                    e.preventDefault();
                    if (content.trim().length < 10) {
                        alert('Будь ласка, розпишіть думки детальніше (мінімум 10 символів).');
                        return;
                    }
                    onSave({ date, mood, tags, content });
                };

                return (
                    <div className="bgc-white br-radius-24px pg-2 br-1 brc-0 w100" style={{maxWidth: '600px', margin: '0 auto'}}>
                        <h2 className="text-al-center ymg-16px">Створити новий запис</h2>
                        <form onSubmit={handleSubmit} className="flex-container-column">
                            <label className="ymg-8px"><b>Дата:</b></label>
                            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="pg-8px br-1 brc-0 br-radius-16px" required disabled={disabled} />

                            <label className="ymg-8px tmg-16px"><b>Теги (наприклад #навчання, #ідеї):</b></label>
                            <input type="text" value={tags} onChange={(e) => setTags(e.target.value)} placeholder="#тег" className="pg-8px br-1 brc-0 br-radius-16px" disabled={disabled} />

                            <label className="ymg-8px tmg-16px"><b>Оцінка стану (1 - Жахливо, 5 - Чудово):</b></label>
                            <select value={mood} onChange={(e) => setMood(e.target.value)} className="pg-8px br-1 brc-0 br-radius-16px" disabled={disabled}>
                                <option value="5">Чудовий (5)</option>
                                <option value="4">Хороший (4)</option>
                                <option value="3">Нормальний (3)</option>
                                <option value="2">Поганий (2)</option>
                                <option value="1">Жахливий (1)</option>
                            </select>

                            <label className="ymg-8px tmg-16px"><b>Ваші думки:</b></label>
                            <textarea value={content} onChange={(e) => setContent(e.target.value)} rows="6" placeholder="Що у вас на думці?" className="pg-8px br-1 brc-0 br-radius-16px" required disabled={disabled}></textarea>

                            <button type="submit" className="prpl-btn pg-16px br-radius-16px tmg-24px text-al-center" disabled={disabled}>
                                Зберегти у щоденник
                            </button>
                        </form>
                    </div>
                );
            };

            // === СУБ-КОМПОНЕНТ 3: ТАБЛИЦЯ АНАЛІТИКИ ===
            const AnalyticsView = ({ entries }) => (
                <div className="bgc-white br-radius-24px pg-2 br-1 brc-0 w100" style={{maxWidth: '900px', margin: '0 auto', overflowX: 'auto'}}>
                    <h2 class="ymg-16px">Зведена таблиця аналітики емоцій</h2>
                    <table style={{width: '100%', borderCollapse: 'collapse', textAlign: 'left'}}>
                        <thead>
                            <tr style={{backgroundColor: 'rgb(246, 246, 255)'}}>
                                <th style={{padding: '12px', borderBottom: '1px solid #ccc'}}>Дата</th>
                                <th style={{padding: '12px', borderBottom: '1px solid #ccc'}}>Оцінка</th>
                                <th style={{padding: '12px', borderBottom: '1px solid #ccc'}}>Теги</th>
                                <th style={{padding: '12px', borderBottom: '1px solid #ccc'}}>Фрагмент тексту</th>
                            </tr>
                        </thead>
                        <tbody>
                            {entries.length === 0 ? (
                                <tr>
                                    <td colSpan="4" style={{padding: '12px', textAlign: 'center'}}>Дані відсутні</td>
                                </tr>
                            ) : (
                                entries.map(item => (
                                    <tr key={item.id}>
                                        <td style={{padding: '12px', borderBottom: '1px solid #eee'}}>{item.date}</td>
                                        <td style={{padding: '12px', borderBottom: '1px solid #eee', fontWeight: 'bold', color: 'rgb(92, 43, 226)'}}>{item.mood} / 5</td>
                                        <td style={{padding: '12px', borderBottom: '1px solid #eee', color: 'gray'}}>{item.tags || '-'}</td>
                                        <td style={{padding: '12px', borderBottom: '1px solid #eee'}}>{item.content.substring(0, 60)}...</td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            );

            // Рендер додатку
            const root = ReactDOM.createRoot(document.getElementById('react-dashboard-root'));
            root.render(<DashboardApp />);
        </script>
    </body>
</html>
