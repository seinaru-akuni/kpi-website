<!DOCTYPE html>
<html lang="uk">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindFlow - Погода</title>
        
        <link rel="stylesheet" href="css/utilities.css">
        <link rel="stylesheet" href="css/mainStyles.css">

        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    </head>
    <body class="bgc-0">

        <header class="container-fluid bbr-1 brc-0 bgc-white inline-block white-space-nowrap overflow-hidden" style="height: 70px">
            <div class="clmp-xmg-5 inline-block al-items-stretch text-al-left text-al-justify" id="header-container" style="width: 90%;height: 100%;">
                <h2 class="inline-block vertical-al-middle mg-0 tmg-16px cl-prpl">MindFlow Weather</h2>
                <a href="index.html" class="inline-block vertical-al-middle lmg-24px tmg-16px">Повернутися на головну</a>
            </div>
        </header>

        <main class="flex-container-column x-center y-center mg-2">
            <div id="react-weather-root" class="w100 flex-container-column x-center y-center"></div>
        </main>

        <script type="text/babel">
            const { useState, useEffect } = React;

            // Компонент 1: Картка одного дня погоди
            const WeatherCard = ({ day }) => (
                <div className="bgc-0 br-radius-16px pg-16px br-1 brc-0 flex-container-column x-center y-center" style={{minWidth: '130px'}}>
                    <p className="mg-0" style={{textTransform: 'capitalize'}}><b>{day.date}</b></p>
                    <img src={`https://openweathermap.org/img/wn/${day.icon}@2x.png`} alt={day.desc} />
                    <h2 className="mg-0 cl-prpl">{Math.round(day.temp)}°C</h2>
                    <p className="mg-0 tmg-8px text-al-center" style={{fontSize: '0.85rem', color: '#555'}}>{day.desc}</p>
                </div>
            );

            // Компонент 2: Головний віджет
            const WeatherWidget = () => {
                const [city, setCity] = useState('');
                const [forecast, setForecast] = useState([]);
                
                // Стани для блокування UI та обробки помилок
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);

                // ВАЖЛИВО: Вставте сюди свій API ключ OpenWeatherMap!
                const API_KEY = '23058113e34db50359b4e4986fa76211'; 

                // Асинхронна функція отримання даних
                const fetchWeather = async (searchCity) => {
                    setLoading(true); // Блокуємо UI, показуємо лоадер
                    setError(null);
                    setForecast([]);

                    // Створюємо AbortController для реалізації таймауту запиту (вимога лаби)
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // Таймаут 8 секунд

                    try {
                        // Виконуємо AJAX запит через fetch
                        const response = await fetch(
                            `https://api.openweathermap.org/data/2.5/forecast?q=${searchCity}&units=metric&lang=ua&appid=${API_KEY}`,
                            { signal: controller.signal }
                        );

                        clearTimeout(timeoutId); // Очищуємо таймаут, якщо відповідь прийшла вчасно

                        // Обробка HTTP помилок від сервера
                        if (!response.ok) {
                            if (response.status === 404) throw new Error("Місто не знайдено. Перевірте назву.");
                            if (response.status === 401) throw new Error("Помилка авторизації. Перевірте API ключ.");
                            throw new Error(`Помилка сервера: ${response.status}`);
                        }

                        const data = await response.json(); // Парсимо JSON

                        // API повертає дані кожні 3 години (40 записів на 5 днів). 
                        // Фільтруємо, щоб отримати прогноз лише на 12:00 кожного дня.
                        const dailyData = data.list
                            .filter(item => item.dt_txt.includes("12:00:00"))
                            .map(item => ({
                                date: new Date(item.dt_txt).toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'short' }),
                                temp: item.main.temp,
                                desc: item.weather[0].description,
                                icon: item.weather[0].icon
                            }));

                        setForecast(dailyData);

                    } catch (err) {
                        // Обробка помилок комунікації
                        if (err.name === 'AbortError') {
                            setError("Перевищено час очікування відповіді від сервера (Таймаут).");
                        } else if (err.message === "Failed to fetch") {
                            setError("Проблема з підключенням до Інтернету.");
                        } else {
                            setError(err.message);
                        }
                    } finally {
                        setLoading(false); // Знімаємо блокування UI
                    }
                };

                // Обробник форми
                const handleSubmit = (e) => {
                    e.preventDefault();
                    if (city.trim() !== '') {
                        fetchWeather(city.trim());
                    }
                };

                return (
                    <div className="bgc-white br-radius-24px pg-2 br-1 brc-0 w100" style={{maxWidth: '800px'}}>
                        <h2 className="ymg-16px text-al-center">Прогноз погоди на 5 днів</h2>
                        <p className="text-al-center mg-0 ymg-8px" style={{color: 'gray'}}>Плануйте свій день та відслідковуйте вплив погоди на настрій.</p>

                        <form onSubmit={handleSubmit} className="flex-container-row flex-space-between tmg-16px al-items-stretch" style={{gap: '12px'}}>
                            <input
                                type="text"
                                value={city}
                                onChange={(e) => setCity(e.target.value)}
                                placeholder="Наприклад: Київ, Львів, London..."
                                className="pg-8px br-1 brc-0 br-radius-16px flex-2"
                                disabled={loading} // Блокування інпуту під час запиту
                            />
                            <button 
                                type="submit" 
                                className={`pg-8px xpg-24px br-radius-16px flex-1 ${loading ? 'white-btn' : 'prpl-btn'}`} 
                                disabled={loading} // Блокування кнопки під час запиту
                            >
                                {loading ? 'Пошук...' : 'Отримати прогноз'}
                            </button>
                        </form>

                        {/* Відображення помилки */}
                        {error && (
                            <div className="tmg-16px pg-16px br-radius-16px" style={{backgroundColor: '#ffebee', color: '#c62828', border: '1px solid #ef9a9a'}}>
                                <strong>Помилка: </strong> {error}
                            </div>
                        )}

                        {/* Лоадер (блокування інтерфейсу) */}
                        {loading && (
                            <div className="tmg-24px flex-container-column x-center y-center">
                                <div className="loader-spinner"></div>
                                <p className="tmg-8px cl-prpl">Зв'язок із сервером OpenWeatherMap...</p>
                            </div>
                        )}

                        {/* Результат (Віджет з днями) */}
                        {!loading && !error && forecast.length > 0 && (
                            <div className="flex-container-row flex-space-between tmg-24px" style={{overflowX: 'auto', gap: '16px'}}>
                                {forecast.map((day, index) => (
                                    <WeatherCard key={index} day={day} />
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            // Рендер React додатку у DOM
            const root = ReactDOM.createRoot(document.getElementById('react-weather-root'));
            root.render(<WeatherWidget />);
        </script>
    </body>
</html>
