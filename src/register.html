<main class="flex-container-column x-center y-center mg-2">
    <div class="bgc-white br-radius-24px pg-2 br-1 brc-0" style="width: 100%; max-width: 400px;">
        <h2 class="text-al-center ymg-16px">Створити акаунт</h2>
        
        <form action="dashboard.html" method="GET" class="flex-container-column" aria-label="Форма реєстрації">
            <label for="reg-login" class="ymg-8px">Логін:</label>
            <input type="text" id="reg-login" name="login" class="pg-8px br-1 brc-0 br-radius-16px" required aria-required="true">

            <label for="reg-email" class="ymg-8px tmg-16px">Електронна пошта:</label>
            <input type="email" id="reg-email" name="email" class="pg-8px br-1 brc-0 br-radius-16px" required aria-required="true">

            <label for="reg-password" class="ymg-8px tmg-16px">Пароль:</label>
            <input type="password" id="reg-password" name="password" class="pg-8px br-1 brc-0 br-radius-16px" required aria-required="true">

            <button type="submit" class="prpl-btn pg-16px br-radius-16px tmg-24px">Зареєструватися</button>
        </form>
    </div>
</main>
